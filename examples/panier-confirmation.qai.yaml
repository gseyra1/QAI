# Parcours de démonstration des vérifications ajoutées en 0.2 :
#   - une confirmation native, que le pilote refusait automatiquement avant
#   - un appel réseau, qu'aucune assertion sur l'écran ne peut voir échouer
#
# Vert sur la boutique saine, rouge avec « --bug reco-500 » : la différence
# n'est visible NULLE PART sur l'écran, c'est tout l'intérêt.
id: panier-confirmation
title: Vider le panier demande une confirmation, et l'écran ne ment pas sur le réseau
tags: [critical-path, dialogues]

steps:
  - id: s1
    do: rechercher "chaise de bureau"
    expect: la liste de résultats contient au moins un article

  - id: s2
    do: ouvrir le premier article de la liste

  - id: s3
    do: ajouter l'article au panier

  - id: s4
    do: ouvrir le panier
    expect:
      - le panier contient un article
      - aucun appel réseau n'échoue
      - la console reste propre

  - id: s5
    do: vider le panier en confirmant la boîte de dialogue
    expect: le panier est vide
