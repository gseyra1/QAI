name: Action

# The action must be exercised, not just written: it is the only way to
# verify the pull-request comment, the captures artifact, and exit-code
# propagation.
on: [push, pull_request]

jobs:
  # Le contrôle requis. Il joue le QAI de CETTE branche, empaqueté comme npm
  # le publierait : installer « latest » depuis le registre ferait valider une
  # pull request par le code d'une autre version — voire, avant publication,
  # par la version précédente.
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      # L'archive va dans RUNNER_TEMP, hors du dépôt. node_modules et dist
      # sont retirés ensuite : l'action trouve un dépôt comme celui d'un
      # utilisateur, et rien de construit ici ne peut répondre à sa place.
      - name: Package
        id: pack
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          name=$(npm pack --pack-destination "$RUNNER_TEMP" --json \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          echo "tarball=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          rm -rf node_modules dist

      - name: Demo shop
        run: |
          node fixtures/serve.mjs --port 8899 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/ >/dev/null && break
            sleep 0.5
          done

      - uses: ./
        with:
          package: ${{ steps.pack.outputs.tarball }}
          comment: ${{ github.event.pull_request.head.repo.fork && 'false' || 'true' }}
          base-url: http://127.0.0.1:8899/
          scenarios: examples/checkout-guest.qai.yaml
          # The scenario declares « given » : since 0.1.0 the engine refuses to
          # play it without a StateProvider, instead of running it anonymous.
          states: ./examples/states-example.ts

      # Un vert qui n'a pas joué la branche ne prouve rien : le CLI installé
      # doit être, octet pour octet, celui de l'archive construite plus haut.
      - name: Ran this branch
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          tar -xzOf "$TARBALL" package/dist/cli.js | cmp - node_modules/tilmiqai/dist/cli.js
          echo "ran $(basename "$TARBALL")"
