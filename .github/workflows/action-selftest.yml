name: Action

# L'action elle-même doit être exercée, pas seulement écrite : c'est le seul
# moyen de vérifier le commentaire de pull request, l'artefact de captures et
# la propagation du code de sortie.
on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Boutique de démonstration
        run: |
          node fixtures/serve.mjs --port 8899 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/ >/dev/null && break
            sleep 0.5
          done

      - uses: ./
        with:
          comment: ${{ github.event.pull_request.head.repo.fork && 'false' || 'true' }}
          base-url: http://127.0.0.1:8899/
          scenarios: examples/checkout-guest.qai.yaml
