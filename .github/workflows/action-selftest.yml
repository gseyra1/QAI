name: Action

# The action must be exercised, not just written: it is the only way to
# verify the pull-request comment, the captures artifact, and exit-code
# propagation.
on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Demo shop
        run: |
          node fixtures/serve.mjs --port 8899 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/ >/dev/null && break
            sleep 0.5
          done

      - uses: ./
        with:
          comment: ${{ github.event.pull_request.head.repo.fork && 'false' || 'true' }}
          base-url: http://127.0.0.1:8899/
          scenarios: examples/checkout-guest.qai.yaml
          # The scenario declares « given » : since 0.1.0 the engine refuses to
          # play it without a StateProvider, instead of running it anonymous.
          states: ./examples/states-exemple.ts
