name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Une analyse hebdomadaire attrape les règles nouvellement publiées sur du
    # code qui, lui, n'a pas bougé.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # « analyze » interroge l'API des exécutions pour rattacher son rapport au
      # bon commit. Sans cette lecture, l'étape échoue sur un 403 opaque.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
