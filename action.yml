name: QAI
description: Rejoue les parcours critiques et commente la pull request

inputs:
  base-url:
    description: Racine de l'application à tester (déploiement de prévisualisation)
    required: true
  scenarios:
    description: Fichiers, dossiers ou motif. Par défaut, lus depuis qai.config.json
    required: false
    default: ''
  config:
    description: Chemin du fichier de configuration
    required: false
    default: ''
  states:
    description: Module exportant un StateProvider, pour l'état déclaré par « given »
    required: false
    default: ''
  heal:
    description: Réparer les cibles périmées et réécrire les résolutions
    required: false
    default: 'false'
  strict:
    description: Une réparation fait échouer la vérification
    required: false
    default: 'false'
  comment:
    description: Poster le rapport en commentaire de la pull request
    required: false
    default: 'true'
  github-token:
    description: Jeton pour poster le commentaire
    required: false
    default: ${{ github.token }}
  version:
    description: Version de QAI à utiliser
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'

    # Installé avant le navigateur : « playwright install » doit résoudre la
    # version de Playwright dont dépend QAI. Une version obtenue à part
    # téléchargerait un binaire que QAI ne saurait pas lancer.
    #
    # Aucun input n'est interpolé (${{ }}) dans un script : le shell évaluerait
    # ce qu'un appelant hostile y glisse. Tout passe par l'environnement, que
    # bash développe sans jamais le réinterpréter.
    - name: Installation
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm i --no-save --no-audit --no-fund --ignore-scripts "tilmiqai@$VERSION"

    - name: Navigateur
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Rejeu des parcours
      id: qai
      shell: bash
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCENARIOS: ${{ inputs.scenarios }}
        BASE_URL: ${{ inputs.base-url }}
        CONFIG: ${{ inputs.config }}
        STATES: ${{ inputs.states }}
        HEAL: ${{ inputs.heal }}
        STRICT: ${{ inputs.strict }}
      run: |
        # Les arguments sont assemblés en tableau : chaque valeur reste un mot,
        # jamais du code. Seul SCENARIOS est découpé sur les espaces — c'est un
        # input multi-fichiers — et le découpage ne réévalue rien.
        args=(run)
        for s in $SCENARIOS; do args+=("$s"); done
        args+=(--base-url "$BASE_URL")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ -n "$STATES" ] && args+=(--states "$STATES")
        [ "$HEAL" = "true" ] && args+=(--heal)
        [ "$STRICT" = "true" ] && args+=(--strict)
        args+=(--format markdown --out "$RUNNER_TEMP/qai-report.md" --run-url "$RUN_URL")
        set +e
        npx qai "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        set -e

    # Publiées avant le commentaire : le rapport y renvoie, donc elles doivent
    # exister quand un relecteur clique.
    - name: Captures d'échec
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: qai-captures
        path: .qai/artifacts
        if-no-files-found: ignore
        retention-days: 14

    - name: Commentaire de pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        REPORT="$RUNNER_TEMP/qai-report.md"
        [ -f "$REPORT" ] || exit 0
        # Un marqueur invisible permet de mettre à jour le commentaire existant
        # plutôt que d'en empiler un à chaque exécution.
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
          --jq 'map(select(.body | startswith("<!-- qai-report -->"))) | .[0].id // empty')
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
            -F body=@"$REPORT" > /dev/null
        else
          gh pr comment "$PR" --body-file "$REPORT"
        fi

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.qai.outputs.exit-code }}
      run: exit "$CODE"
