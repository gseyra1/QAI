name: QAI
description: Replays the critical journeys and comments on the pull request

inputs:
  base-url:
    description: Root of the application under test (preview deployment)
    required: true
  scenarios:
    description: Files, directories, or a glob. Defaults to qai.config.json
    required: false
    default: ''
  config:
    description: Path to the configuration file
    required: false
    default: ''
  states:
    description: Module exporting a StateProvider, for state declared by "given"
    required: false
    default: ''
  heal:
    description: Repair stale targets and rewrite the resolutions
    required: false
    default: 'false'
  strict:
    description: A repair fails the check
    required: false
    default: 'false'
  comment:
    description: Post the report as a pull-request comment
    required: false
    default: 'true'
  github-token:
    description: Token used to post the comment
    required: false
    default: ${{ github.token }}
  version:
    description: QAI version to install
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'

    # Installed before the browser: "playwright install" must resolve the
    # Playwright version QAI depends on. A separately obtained version would
    # download a binary QAI cannot drive.
    #
    # No input is interpolated (${{ }}) inside a script: the shell would
    # evaluate whatever a hostile caller slips in. Everything goes through the
    # environment, which bash expands without ever re-interpreting it.
    - name: Install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm i --no-save --no-audit --no-fund --ignore-scripts "tilmiqai@$VERSION"

    - name: Browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Replay journeys
      id: qai
      shell: bash
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCENARIOS: ${{ inputs.scenarios }}
        BASE_URL: ${{ inputs.base-url }}
        CONFIG: ${{ inputs.config }}
        STATES: ${{ inputs.states }}
        HEAL: ${{ inputs.heal }}
        STRICT: ${{ inputs.strict }}
      run: |
        # Arguments are assembled as an array: every value stays a word,
        # never code. Only SCENARIOS is split on spaces — it is a multi-file
        # input — and word splitting re-evaluates nothing.
        args=(run)
        for s in $SCENARIOS; do args+=("$s"); done
        args+=(--base-url "$BASE_URL")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ -n "$STATES" ] && args+=(--states "$STATES")
        [ "$HEAL" = "true" ] && args+=(--heal)
        [ "$STRICT" = "true" ] && args+=(--strict)
        args+=(--format markdown --out "$RUNNER_TEMP/qai-report.md" --run-url "$RUN_URL")
        set +e
        npx qai "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        set -e

    # Uploaded before the comment: the report links to them, so they must
    # exist by the time a reviewer clicks.
    - name: Failure captures
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: qai-captures
        path: .qai/artifacts
        if-no-files-found: ignore
        retention-days: 14

    - name: Pull-request comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        REPORT="$RUNNER_TEMP/qai-report.md"
        [ -f "$REPORT" ] || exit 0
        # An invisible marker lets the action update the existing comment
        # instead of stacking a new one per run.
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
          --jq 'map(select(.body | startswith("<!-- qai-report -->"))) | .[0].id // empty')
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
            -F body=@"$REPORT" > /dev/null
        else
          gh pr comment "$PR" --body-file "$REPORT"
        fi

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.qai.outputs.exit-code }}
      run: exit "$CODE"
