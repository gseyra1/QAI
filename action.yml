name: QAI
description: Replays the critical journeys and comments on the pull request

inputs:
  base-url:
    description: Root of the application under test (preview deployment)
    required: true
  scenarios:
    description: Files, directories, or a glob. Defaults to qai.config.json
    required: false
    default: ''
  config:
    description: Path to the configuration file
    required: false
    default: ''
  states:
    description: Module exporting a StateProvider, for state declared by "given"
    required: false
    default: ''
  provider:
    description: Module exporting a ModelProvider, required by heal unless qai.config.json names one
    required: false
    default: ''
  heal:
    description: Repair stale targets and rewrite the resolutions (needs a provider)
    required: false
    default: 'false'
  strict:
    description: A repair fails the check
    required: false
    default: 'false'
  comment:
    description: Post the report as a pull-request comment
    required: false
    default: 'true'
  github-token:
    description: Token used to post the comment
    required: false
    default: ${{ github.token }}
  version:
    description: QAI version to install from npm (ignored when package is set)
    required: false
    default: latest
  package:
    description: What to install instead of tilmiqai@<version> — any npm install spec, such as a local .tgz built by npm pack
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'

    # Installed before the browser: the browser must be the build of the
    # Playwright QAI depends on. A separately obtained version would download
    # a binary QAI cannot drive.
    #
    # No input is interpolated (${{ }}) inside a script: the shell would
    # evaluate whatever a hostile caller slips in. Everything goes through the
    # environment, which bash expands without ever re-interpreting it. "--"
    # keeps a package value starting with a dash a spec, never an npm flag.
    - name: Install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PACKAGE: ${{ inputs.package }}
      run: |
        spec="${PACKAGE:-tilmiqai@$VERSION}"
        if [ -n "$PACKAGE" ] && [ "$VERSION" != latest ]; then
          echo "::warning::version ($VERSION) is ignored: package is set"
        fi
        npm i --no-save --no-audit --no-fund --ignore-scripts -- "$spec"
        # A spec naming another package, or an unbuilt tilmiqai (a git URL:
        # dist/ is not committed), would leave no qai to run: say so here,
        # rather than as a missing command three steps later.
        if [ ! -f node_modules/tilmiqai/package.json ] || [ ! -e node_modules/.bin/qai ]; then
          echo "::error::$spec did not install a runnable tilmiqai"
          exit 1
        fi
        echo "QAI $(node -p 'require("./node_modules/tilmiqai/package.json").version') from $spec"

    # "npx playwright" would run whichever Playwright sits at the top of
    # node_modules: the project's own, when it pins another version, and QAI's
    # copy then lives nested under tilmiqai. Resolving from tilmiqai's
    # directory, as Node does when QAI imports it, installs the browser of the
    # Playwright that will actually launch it.
    - name: Browser
      shell: bash
      run: |
        cli=$(node -p 'const { dirname, join } = require("path");
          const from = require("fs").realpathSync("node_modules/tilmiqai");
          join(dirname(require.resolve("playwright/package.json", { paths: [from] })), "cli.js")')
        node "$cli" install --with-deps chromium

    - name: Replay journeys
      id: qai
      shell: bash
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCENARIOS: ${{ inputs.scenarios }}
        BASE_URL: ${{ inputs.base-url }}
        CONFIG: ${{ inputs.config }}
        STATES: ${{ inputs.states }}
        PROVIDER: ${{ inputs.provider }}
        HEAL: ${{ inputs.heal }}
        STRICT: ${{ inputs.strict }}
      run: |
        # Arguments are assembled as an array: every value stays a word,
        # never code. Only SCENARIOS is split on spaces — it is a multi-file
        # input — and word splitting re-evaluates nothing.
        args=(run)
        for s in $SCENARIOS; do args+=("$s"); done
        args+=(--base-url "$BASE_URL")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ -n "$STATES" ] && args+=(--states "$STATES")
        [ -n "$PROVIDER" ] && args+=(--provider "$PROVIDER")
        [ "$HEAL" = "true" ] && args+=(--heal)
        [ "$STRICT" = "true" ] && args+=(--strict)
        args+=(--format markdown --out "$RUNNER_TEMP/qai-report.md" --run-url "$RUN_URL")
        set +e
        # --no: without a local qai, CI makes npx fetch whatever the registry
        # publishes under that name and run it amid the job's secrets. "--"
        # is needed with it: after --no, npx would take --help or --version
        # for itself.
        npx --no -- qai "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        set -e

    # Uploaded before the comment: the report links to them, so they must
    # exist by the time a reviewer clicks.
    - name: Failure captures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: qai-captures
        path: .qai/artifacts
        if-no-files-found: ignore
        retention-days: 14

    - name: Pull-request comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        REPORT="$RUNNER_TEMP/qai-report.md"
        [ -f "$REPORT" ] || exit 0
        # An invisible marker lets the action update the existing comment
        # instead of stacking a new one per run.
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
          --jq 'map(select(.body | startswith("<!-- qai-report -->"))) | .[0].id // empty')
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
            -F body=@"$REPORT" > /dev/null
        else
          gh pr comment "$PR" --body-file "$REPORT"
        fi

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.qai.outputs.exit-code }}
      run: exit "$CODE"
